# Claude Code Docker — tmux config

# Status bar on top
set-option -g status-position top

# Style: dark background matching the welcome dashboard theme
set-option -g status-style 'bg=#12151e,fg=#94a3b8'

# Left: empty (clean look)
set-option -g status-left '#[fg=#64748b] '
set-option -g status-left-length 2

# Right: new terminal button only
set-option -g status-right '#[fg=#64748b]│#[fg=#22c55e,bold] + New Terminal '
set-option -g status-right-length 20

# Center: window tabs (clickable — tmux native window switching)
set-option -g status-justify left
setw -g window-status-current-format '#[fg=#e2e8f0,bold] ● Terminal #I'
setw -g window-status-format '#[fg=#64748b] ○ Terminal #I'
setw -g window-status-separator '#[fg=#64748b] '

# No window activity alerts
set-option -g visual-activity off
set-option -g monitor-activity off

# Mouse OFF: the browser (xterm.js) owns the mouse, so drag-select highlights
# text natively like a webpage, right-click gives the Copy/Paste menu, and
# Cmd-C / Cmd-V use the real system clipboard. tmux never intercepts the drag.
# Trade-off: mouse wheel no longer scrolls tmux and status-bar tabs are not
# clickable -- keyboard equivalents below cover both.
set-option -g mouse off

# Clipboard: keep OSC 52 so CLI programs that copy (e.g. via escape sequence)
# still reach the browser clipboard through ttyd.
set-option -g set-clipboard on
set-option -g allow-passthrough on

# Keyboard scrollback (replaces the lost mouse wheel):
#   Shift-PageUp / Shift-PageDown  -- enter copy-mode and page through history
bind-key -n S-PageUp copy-mode -u
bind-key -T copy-mode S-PageUp send-keys -X page-up
bind-key -T copy-mode S-PageDown send-keys -X page-down

# Click status-right → new terminal window
bind-key -n MouseUp1StatusRight new-window "CLAUDE_AUTO_LAUNCH=0 bash --init-file /opt/claude-code-docker/scripts/shell-init.sh"

# Increase scrollback
set-option -g history-limit 50000

# New terminal: Ctrl+T opens a shell (no auto-launch Claude)
bind-key -n C-t new-window "CLAUDE_AUTO_LAUNCH=0 bash --init-file /opt/claude-code-docker/scripts/shell-init.sh"

# Switch windows: Ctrl+PageUp / Ctrl+PageDown
bind-key -n C-PageUp previous-window
bind-key -n C-PageDown next-window

# Close window: Ctrl+W
bind-key -n C-w confirm-before -p "Close this terminal? (y/n)" kill-window

# Window numbering starts at 1 (not 0)
set-option -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
