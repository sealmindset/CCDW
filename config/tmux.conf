# Claude Code Docker — tmux config
# Top status bar with navigation breadcrumb

# Status bar on top
set-option -g status-position top

# Style: dark background matching the welcome dashboard theme
set-option -g status-style 'bg=#12151e,fg=#94a3b8'

# Left: home breadcrumb
set-option -g status-left '#[fg=#6366f1,bold] ◀ Home :3000 #[fg=#64748b]│ '
set-option -g status-left-length 25

# Right: other services
set-option -g status-right '#[fg=#64748b]│#[fg=#94a3b8] VS Code :8080 #[fg=#64748b]│#[fg=#94a3b8] Workshop :9200 '
set-option -g status-right-length 45

# Center: terminal label
set-option -g status-justify left
setw -g window-status-current-format '#[fg=#e2e8f0,bold] Terminal'
setw -g window-status-format '#[fg=#64748b] Terminal'

# No window activity alerts
set-option -g visual-activity off
set-option -g monitor-activity off

# Mouse support (scroll, select)
set-option -g mouse on

# Increase scrollback
set-option -g history-limit 50000
