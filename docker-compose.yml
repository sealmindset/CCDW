# =============================================================================
# Claude Code Docker - Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d          Start the container
#   docker compose down            Stop the container (data preserved)
#   docker compose logs -f         View logs
#   docker compose exec claude bash  Open a shell inside the container
# =============================================================================

services:
  claude:
    build:
      context: .
      args:
        REGISTRY_MIRROR: ${REGISTRY_MIRROR:-}
    image: ghcr.io/sealmindset/claude-code-docker:latest
    container_name: claude-code
    ports:
      - "${WORKSHOP_PORT:-9200}:9200"        # Workshop (Business User IDE)
      - "${CHAT_PORT:-3002}:3002"            # Claude Chat (standalone chat)
      - "${WELCOME_PORT:-3000}:3000"         # Welcome dashboard
      - "${TTYD_PORT:-7681}:7681"            # Web terminal (ttyd - main session)
      - "${TTYD_NEW_PORT:-7682}:7682"       # Web terminal (ttyd - new window)
      - "${CODE_SERVER_PORT:-8080}:8080"     # VS Code in browser (code-server)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount host Docker socket for sibling container execution
      - /var/run/docker.sock:/var/run/docker.sock
      # User folders: mount Documents, Downloads, Desktop for full file access
      - ${PROJECTS_PATH:-~/Documents}:/home/coder/Documents
      - ~/Downloads:/home/coder/Downloads
      - ~/Desktop:/home/coder/Desktop
      # Persistent data: Claude Code settings, skills, git config, gh auth
      - claude-code-data:/home/coder/.claude
      - git-config:/home/coder/.gitconfig.d
      - gh-config:/home/coder/.config/gh
      # Mount host Azure CLI credentials (for token-based auth)
      # macOS/Linux: HOME is always set. Windows: set HOME=%USERPROFILE% in .env
      - ${HOME:-.}/.azure:/home/coder/.azure
      # Mount host AWS config (for Bedrock SSO)
      - ${HOME:-.}/.aws:/home/coder/.aws
      # Mount host kube config (for kubectl / argo-it)
      - ${HOME:-.}/.kube:/home/coder/.kube
      # Mount host git config read-only (inherit identity without re-configuring)
      - ${HOME:-.}/.gitconfig:/home/coder/.host-gitconfig:ro
    env_file:
      - path: .env
        required: false
    environment:
      - TERM=xterm-256color
      - GH_TOKEN=${GH_TOKEN:-}
    restart: unless-stopped
    # Add coder user to docker group for socket access
    group_add:
      - "${DOCKER_GID:-999}"

volumes:
  claude-code-data:
    name: claude-code-data
  git-config:
    name: claude-code-git-config
  gh-config:
    name: claude-code-gh-config
