<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki — CCDW</title>
    <link rel="stylesheet" href="/shared-nav.css">
    <link rel="stylesheet" href="/wiki/wiki.css">
</head>
<body>
    <div class="wiki-shell">
        <aside class="wiki-sidebar" id="sidebar">
            <div class="wiki-search">
                <svg class="wiki-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" id="searchInput" placeholder="Search the wiki" autocomplete="off" spellcheck="false" aria-label="Search the wiki">
                <kbd class="wiki-search-hint">/</kbd>
            </div>
            <nav class="wiki-tree" id="tree" aria-label="Wiki contents"></nav>
            <div class="wiki-results" id="results" hidden></div>
        </aside>

        <main class="wiki-main">
            <button class="wiki-contents-toggle" id="contentsToggle" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                Contents
            </button>

            <article class="wiki-doc" id="doc">
                <p class="wiki-loading">Loading…</p>
            </article>

            <nav class="wiki-pager" id="pager" aria-label="Previous and next page"></nav>

            <footer class="wiki-foot" id="foot"></footer>
        </main>

        <aside class="wiki-toc" id="toc" aria-label="On this page"></aside>
    </div>

    <script src="/shared-nav.js"></script>
    <script src="/wiki/wiki.js"></script>
</body>
</html>
